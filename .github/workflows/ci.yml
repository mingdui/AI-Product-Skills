name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: 发布前自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # 门禁 1：U+FFFD 乱码。
      # Windows + Git Bash 的 heredoc 会把中文静默写成替换字符，不报错，直接进历史。
      - name: 门禁 1 — 乱码扫描（U+FFFD）
        run: |
          set -euo pipefail
          # -I：跳过二进制文件，否则 PNG 里的字节序列会被误判成乱码
          if grep -rnI $'\xef\xbf\xbd' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::发现 U+FFFD 替换字符（乱码）。中文内容请用编辑器写入，不要用 shell heredoc。"
            exit 1
          fi
          echo "✅ 无乱码"

      # 门禁 2：泄漏扫描。
      # 个人绝对路径会把作者的本机目录结构带进公开历史，且 force push 也抹不掉。
      - name: 门禁 2 — 个人路径扫描
        run: |
          set -euo pipefail
          # 用 . 匹配路径分隔符，避免在 YAML / shell 里转义反斜杠（那会让正则失灵或直接报错）
          PATTERN='(/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/|[A-Za-z]:.Users.)'
          if grep -rnIE "$PATTERN" . \
               --exclude-dir=.git \
               --exclude-dir=node_modules \
               --exclude=ci.yml; then
            echo "::error::发现个人绝对路径。请改成相对路径或不依赖路径的说明。"
            exit 1
          fi
          echo "✅ 无个人绝对路径"

      # 门禁 3：内部标识（哨兵列表）。
      # 哨兵列表的唯一真相源是 ming-qa 的 ci.yml——这里**不存副本**：
      # 存副本会漂移，而且会把哨兵词本身写进本仓库。
      # 取不到时降级为 warning 并跳过，不阻塞构建。
      - name: 门禁 3 — 内部标识扫描
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/mingdui/ming-qa/main/.github/workflows/ci.yml"
          if ! curl -fsSL "$SRC" -o /tmp/truth.yml; then
            echo "::warning::取不到哨兵真相源（$SRC），跳过本门禁。"
            exit 0
          fi
          SENTINELS=$(grep -m1 -oE "SENTINELS='[^']+'" /tmp/truth.yml | sed "s/^SENTINELS='//; s/'\$//")
          if [ -z "$SENTINELS" ]; then
            echo "::warning::未能从真相源解析出 SENTINELS，跳过本门禁。"
            exit 0
          fi
          if grep -rnIE "$SENTINELS" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::命中内部标识哨兵词，请替换为通用表述。"
            exit 1
          fi
          echo "✅ 无内部标识命中（哨兵取自 ming-qa 的 ci.yml）"

      # 门禁 4：提交信息的乱码。
      # 门禁 1 只扫工作区，看不到 git 历史——提交信息里混进 U+FFFD 时它不会响。
      # 而中文在这个环境里偶发被吞字，已经中过一次招（见 CHANGELOG）。
      # 提交信息只能靠 amend + force push 修，所以本门禁是阻塞式：红了就必须处理。
      - name: 门禁 4 — 提交信息乱码扫描
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 先确定要检查哪些提交：PR 用 base，push 用 before，都拿不到就只看 HEAD
          BASE="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            SHAS=$(git log --format=%H "$BASE..$HEAD_SHA")
            SCOPE="区间 $BASE..$HEAD_SHA"
          else
            SHAS=$(git log -1 --format=%H "$HEAD_SHA")
            SCOPE="仅 HEAD（新分支或强制推送）"
          fi

          if [ -z "$SHAS" ]; then
            echo "（无新增提交，跳过）"
            exit 0
          fi

          FAIL=0
          for sha in $SHAS; do
            MSG=$(git log -1 --format=%B "$sha")
            if printf '%s' "$MSG" | grep -q $'\xef\xbf\xbd'; then
              echo "::error::$sha 的提交信息含 U+FFFD 替换字符（乱码）"
              printf '    首行：%s\n' "$(git log -1 --format=%s "$sha")"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::提交信息只能靠 git commit --amend 改，再 force push 修正。"
            exit 1
          fi
          echo "✅ 提交信息无乱码（$SCOPE，共 $(printf '%s\n' $SHAS | wc -l) 个提交）"

  structure:
    name: 仓库结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # 每个 skill 必须是 skills/<name>/ 下的独立目录，含 SKILL.md，
      # 且 frontmatter 的 name 与目录名一致——否则 agent 的发现机制会错位。
      - name: 校验 skills/ 结构
        run: |
          set -euo pipefail
          fail=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "::error file=$dir::缺少 SKILL.md"
              fail=1
              continue
            fi
            fm=$(sed -n '1,10p' "$dir/SKILL.md" | grep -m1 '^name:' | sed 's/^name:[[:space:]]*//' | tr -d '\r')
            if [ "$fm" != "$name" ]; then
              echo "::error file=$dir/SKILL.md::frontmatter name ($fm) 与目录名 ($name) 不一致"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "✅ skills/ 结构正常，共 $(ls -d skills/*/ | wc -l) 个 skill"
